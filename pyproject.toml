[project]
name = "iris-anemia-screening"
version = "0.1.0"
description = "Anemia risk screening from DHS survey answers: a reproducible baseline with an honest evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }   # the pinned list stays in one place

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]     # style errors, unused names, whitespace, import order
# E501: some lines are long on purpose (tables and f-string reports); we do not enforce a line length.
# E731: short `lambda` helpers assigned to names are used throughout and are readable here.
ignore = ["E501", "E731"]
